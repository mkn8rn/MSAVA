name: CI

on:
  push:
    branches:
      - main
      - release/**

  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - release/**
env:
  STEP_TIMEOUT_MINUTES: 60

jobs:
  smoke_test:
    name: Smoke Test (Debug Build of MSAVA)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install Dependencies
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        uses: "./.github/steps/install_dependencies"

      # Add  MSBuild to the PATH: https://github.com/microsoft/setup-msbuild
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.3.1

      - name: Build MSAVA App (Debug)
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        shell: pwsh
        run: msbuild ./MSAVA-App/MSAVA-App.csproj /r
        
      - name: Build MSAVA API (Debug)
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        shell: pwsh
        run: msbuild ./MSAVA-API/MSAVA-API.csproj /r

  unit_test:
    name: Unit Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install Dependencies
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        uses: "./.github/steps/install_dependencies"

      # Add  MSBuild to the PATH: https://github.com/microsoft/setup-msbuild
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.3.1

      - name: Build MSAVA.Tests (Release)
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        shell: pwsh
        run: msbuild ./MSAVA.Tests/MSAVA.Tests.csproj /p:Configuration=Release /p:OverrideTargetFramework=net10.0 /r

      - name: Run Unit Tests
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        shell: pwsh
        run: dotnet test ./MSAVA.Tests/MSAVA.Tests.csproj --no-build -c Release --logger GitHubActions --blame-crash --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Build MSAVA.API.Tests (Release)
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        shell: pwsh
        run: msbuild ./MSAVA.API.Tests/MSAVA.API.Tests.csproj /p:Configuration=Release /r

      - name: Run API Unit Tests
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        shell: pwsh
        run: dotnet test ./MSAVA.API.Tests/MSAVA.API.Tests.csproj --no-build -c Release --logger GitHubActions --blame-crash --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
